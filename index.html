<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="24x24" href="assets/browser-icon-figma.png?v=20260721" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="assets/idle-animation/loading-images-review/01-xerox.webp" fetchpriority="high" />
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="79bb69d5-2b32-4ab4-b7ae-b4f61d34bee1"
      data-domains="synthub.art,www.synthub.art"
    ></script>
    <title>graphic-texture</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap");

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f5f5f5;
      }

      body {
        display: grid;
        place-items: center;
        color: #111116;
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .loading-stage {
        position: relative;
        display: block;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        user-select: none;
        transition: opacity 140ms linear;
      }

      .loading-stage:focus-visible {
        outline: 1px solid #111116;
        outline-offset: -8px;
      }

      body.is-entering .loading-stage {
        opacity: 0;
      }

      .loading-frame {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        width: auto;
        height: auto;
        opacity: 1;
        transition: opacity var(--frame-fade-duration, 180ms) linear;
        will-change: opacity;
      }

      .loading-frame.is-hidden {
        opacity: 0;
      }

      .entry-copy {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        transform: translate(-50%, -50%);
        white-space: nowrap;
        pointer-events: none;
      }

      .product-name {
        margin: 0;
        padding: 0;
        background: transparent;
        font-size: clamp(22px, 2.25vw, 40px);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.045em;
      }

      .brand-lockup {
        display: none;
      }

      .enter-label {
        font-size: 12px;
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: -0.02em;
        text-decoration-line: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      @media (max-width: 640px) {
        :root {
          --safe-area-top: env(safe-area-inset-top, 0px);
          --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }

        html,
        body,
        .loading-stage {
          height: 100dvh;
        }

        .loading-stage {
          background: #242528;
          color: #f5f5f5;
          touch-action: manipulation;
        }

        .loading-frame {
          --frame-fade-duration: 200ms;
        }

        .entry-copy {
          top: calc(50% + 2px);
          left: calc(50% + 2.5px);
          z-index: 3;
          display: block;
          width: 275px;
          height: 50px;
          text-shadow: 0 0 4px #242528, 0 0 10px #242528;
        }

        .product-name {
          display: none;
        }

        .brand-lockup {
          display: flex;
          align-items: flex-start;
          width: 275px;
          height: 50px;
        }

        .brand-mark {
          position: relative;
          flex: 0 0 50px;
          width: 50px;
          height: 50px;
        }

        .brand-mark-piece,
        .brand-wordmark {
          display: block;
          pointer-events: none;
        }

        .brand-mark-piece {
          position: absolute;
        }

        .brand-mark-piece.is-vertical {
          top: 0;
          left: 22.5px;
          width: 5px;
          height: 50px;
        }

        .brand-mark-piece.is-diagonal-a {
          top: 5.53px;
          left: 5.52px;
          width: 38.99px;
          height: 38.99px;
        }

        .brand-mark-piece.is-horizontal {
          top: 22.5px;
          left: 0;
          width: 50px;
          height: 5px;
        }

        .brand-mark-piece.is-diagonal-b {
          top: 5.53px;
          left: 5.56px;
          width: 38.86px;
          height: 38.86px;
        }

        .brand-wordmark {
          width: 165px;
          height: 50px;
          margin-left: 60px;
        }

        .enter-label {
          position: absolute;
          top: 68px;
          left: calc(50% - 2.5px);
          color: #f5f5f5;
          transform: translateX(-50%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-frame {
          transition: none;
        }
      }
      .desktop-entry { display: none; }
      @media (min-width: 641px) {
        .loading-stage { display: none; }
        .desktop-entry {
          display: block;
          position: relative;
          width: 100vw;
          height: 100dvh;
          overflow: hidden;
          background: #f5f5f5;
        }
        .intro {
          position: absolute;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%) scale(var(--entry-scale, 1));
          width: 570px;
          text-align: center;
          z-index: 100;
          pointer-events: none;
        }
        .intro p { margin: 0; color: #000; font-size: 16px; line-height: 20px; font-weight: 400; }
        .intro .intro-cn { height: 40px; padding-top: 16px; font-size: 14px; line-height: 28.8px; letter-spacing: 1px; white-space: nowrap; }
        .intro-enter-wrap { position: relative; height: 74px; width: 100%; }
        .intro-enter {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          position: absolute;
          top: 42.9px;
          left: 50%;
          transform: translateX(-50%);
          padding: 0;
          color: #000;
          background: transparent;
          border: 0;
          font: inherit;
          font-size: 16px;
          line-height: 20px;
          text-decoration: underline;
          text-underline-offset: 2px;
          pointer-events: auto;
          transition: background 120ms, color 120ms;
        }
        .intro-enter::before { content: ""; position: absolute; inset: -12px -18px; }
        .intro-enter:hover { opacity: .55; }
        .intro-enter:focus-visible { outline: 2px solid #242528; outline-offset: 5px; }
        .entry-art {
          position: absolute;
          margin: 0;
          padding: 0;
          border: 0;
          background: transparent;
          cursor: grab;
          touch-action: none;
          user-select: none;
        }
        .entry-art img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .entry-art.is-dragging { cursor: grabbing; }
        .entry-art:focus-visible { outline: 1px dashed #9296a0; outline-offset: 5px; }
        .drag-hint { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      }
    </style>
  </head>
  <body>
    <main class="desktop-entry" aria-label="Graphic Texture introduction">
      <div class="art-field" id="artField"></div>
      <section class="intro">
        <p lang="en">Upload an image, choose a style, and turn it into a graphic texture with print grain, tactile noise, and handmade imperfections.</p>
        <p class="intro-cn" lang="zh-CN">上传素材，选择风格，生成带有印刷感、颗粒感和手工痕迹的图形纹理。</p>
        <div class="intro-enter-wrap"><a class="intro-enter" href="tools/graphic-texture-demo.html">click in</a></div>
      </section>
      <p class="drag-hint" id="dragHint">drag images to move · 拖动图片</p>
    </main>
    <button class="loading-stage" id="enterButton" type="button" aria-label="Enter graphic-texture">
      <img
        class="loading-frame"
        data-effect="thermalMap"
        src="assets/idle-animation/loading-images-review/01-xerox.webp"
        alt=""
        decoding="async"
        fetchpriority="high"
      />
      <span class="entry-copy">
        <span class="product-name">graphic-texture</span>
        <span class="brand-lockup" aria-hidden="true">
          <span class="brand-mark">
            <img class="brand-mark-piece is-vertical" src="assets/mobile-loading-mark-vertical.svg" alt="" />
            <img class="brand-mark-piece is-diagonal-a" src="assets/mobile-loading-mark-diagonal-a.svg" alt="" />
            <img class="brand-mark-piece is-horizontal" src="assets/mobile-loading-mark-horizontal.svg" alt="" />
            <img class="brand-mark-piece is-diagonal-b" src="assets/mobile-loading-mark-diagonal-b.svg" alt="" />
          </span>
          <img class="brand-wordmark" src="assets/mobile-loading-wordmark.svg" alt="" />
        </span>
        <span class="enter-label">Click in</span>
      </span>
    </button>

    <script>
      const targetUrl = "tools/graphic-texture-demo.html";
      const enterButton = document.getElementById("enterButton");
      const frame = document.querySelector(".loading-frame");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const mobileViewport = window.matchMedia("(max-width: 640px)");
      const effects = ["thermalMap", "penTrace", "dotShirt", "xerox"];
      const mobileAssetNames = {};
      const assetNames = [
        "01-xerox.webp",
        "57-dotShirt.webp",
        "60-penTrace.webp",
        "62-xerox.webp",
        "66-xerox.webp",
        "67-thermalMap.webp",
        "68-penTrace.webp",
        "graphic-texture-chain-dotShirt (6).png",
        "graphic-texture-chain-thermalMap (10).png",
        "graphic-texture-chain-xerox (10).png",
        "graphic-texture-chain-xerox (7).png"
      ];
      const items = assetNames.map((name) => ({
        effect: effects.find((effect) => name.toLowerCase().includes(effect.toLowerCase())) || "xerox",
        mobileSrc: mobileAssetNames[name]
          ? `assets/idle-animation/loading-images-review/${mobileAssetNames[name]}`
          : "",
        src: `assets/idle-animation/loading-images-review/${name}`,
      }));
      const effectQueues = new Map();
      let effectOrder = [];
      let lastItem = items[1];
      let lastEffect = lastItem.effect;
      let mobileNextImage = null;
      let transitionVersion = 0;
      let paused = document.hidden || reducedMotion.matches;
      let timer = 0;
      let entering = false;

      function shuffle(list) {
        const copy = list.slice();
        for (let index = copy.length - 1; index > 0; index--) {
          const target = Math.floor(Math.random() * (index + 1));
          [copy[index], copy[target]] = [copy[target], copy[index]];
        }
        return copy;
      }

      function takeItem(forMobile = mobileViewport.matches) {
        if (!effectOrder.length) {
          effectOrder = shuffle(effects);
          if (forMobile && effectOrder[0] === lastEffect) {
            const swapIndex = effectOrder.findIndex((effect) => effect !== lastEffect);
            if (swapIndex > 0) [effectOrder[0], effectOrder[swapIndex]] = [effectOrder[swapIndex], effectOrder[0]];
          }
        }
        const effect = effectOrder.shift();
        let queue = effectQueues.get(effect) || [];
        if (!queue.length) queue = shuffle(items.filter((item) => item.effect === effect));
        let item = queue.shift();
        if (item === lastItem && queue.length) {
          queue.push(item);
          item = queue.shift();
        }
        effectQueues.set(effect, queue);
        lastItem = item;
        if (forMobile) lastEffect = effect;
        return item;
      }

      function preload(item, forMobile = mobileViewport.matches) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          const src = forMobile && item.mobileSrc ? item.mobileSrc : item.src;
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            image.onload = null;
            image.onerror = null;
            resolve({
              ...item,
              loadedSrc: src,
              width: image.naturalWidth,
              height: image.naturalHeight,
            });
          };
          image.onload = finish;
          image.onerror = (error) => {
            if (settled) return;
            settled = true;
            image.onload = null;
            image.onerror = null;
            reject(error);
          };
          image.src = src;
          if (image.complete && image.naturalWidth) finish();
        });
      }

      function placeFrame(sourceWidth = frame.naturalWidth, sourceHeight = frame.naturalHeight) {
        if (!sourceWidth || !sourceHeight) return;
        const isMobile = mobileViewport.matches;
        const stageWidth = enterButton.clientWidth || window.innerWidth;
        const stageHeight = enterButton.clientHeight || window.innerHeight;
        if (isMobile) {
          const rootStyle = getComputedStyle(document.documentElement);
          const safeTop = Number.parseFloat(rootStyle.getPropertyValue("--safe-area-top")) || 0;
          const safeBottom = Number.parseFloat(rootStyle.getPropertyValue("--safe-area-bottom")) || 0;
          const margin = 16;
          const availableWidth = Math.max(1, stageWidth - margin * 2);
          const availableHeight = Math.max(1, stageHeight - safeTop - safeBottom - margin * 2);
          const maximumHeight = Math.min(availableHeight, stageHeight * 0.7);
          const fitScale = Math.min(
            1,
            availableWidth / sourceWidth,
            availableHeight / sourceHeight,
            maximumHeight / sourceHeight,
          );
          const targetWidth = stageWidth * (0.42 + Math.random() * 0.4);
          const scale = Math.min(fitScale, targetWidth / sourceWidth);
          const width = Math.max(1, Math.round(sourceWidth * scale));
          const height = Math.max(1, Math.round(sourceHeight * scale));
          const startTop = safeTop + margin;
          const travelX = Math.max(0, availableWidth - width);
          const travelY = Math.max(0, availableHeight - height);

          frame.style.width = `${width}px`;
          frame.style.height = `${height}px`;
          frame.style.left = `${Math.round(margin + Math.random() * travelX)}px`;
          frame.style.top = `${Math.round(startTop + Math.random() * travelY)}px`;
          return;
        }

        const margin = Math.max(12, Math.min(32, Math.min(window.innerWidth, window.innerHeight) * 0.025));
        const availableWidth = Math.max(1, window.innerWidth - margin * 2);
        const availableHeight = Math.max(1, window.innerHeight - margin * 2);
        const fitScale = Math.min(1, availableWidth / sourceWidth, availableHeight / sourceHeight);
        const randomScale = 0.62 + Math.random() * 0.38;
        const scale = fitScale * randomScale;
        const width = Math.max(1, Math.round(sourceWidth * scale));
        const height = Math.max(1, Math.round(sourceHeight * scale));
        const travelX = Math.max(0, availableWidth - width);
        const travelY = Math.max(0, availableHeight - height);

        frame.style.width = `${width}px`;
        frame.style.height = `${height}px`;
        frame.style.left = `${Math.round(margin + Math.random() * travelX)}px`;
        frame.style.top = `${Math.round(margin + Math.random() * travelY)}px`;
      }

      function wait(duration) {
        return new Promise((resolve) => window.setTimeout(resolve, duration));
      }

      function mobileHoldDuration() {
        return 700 + Math.random() * 700;
      }

      function prepareMobileNext() {
        if (!mobileNextImage) mobileNextImage = preload(takeItem(true), true);
        return mobileNextImage;
      }

      function scheduleMobileNext() {
        window.clearTimeout(timer);
        if (!paused && !reducedMotion.matches) timer = window.setTimeout(showNext, mobileHoldDuration());
      }

      async function showNext() {
        if (!mobileViewport.matches) return;
        if (mobileViewport.matches) {
          const version = transitionVersion;
          let nextItem;
          try {
            nextItem = await prepareMobileNext();
          } catch (_error) {
            mobileNextImage = null;
            if (!paused) timer = window.setTimeout(showNext, 100);
            return;
          }
          if (paused || version !== transitionVersion) return;
          frame.classList.add("is-hidden");
          await wait(200);
          if (paused || version !== transitionVersion) return;
          frame.src = nextItem.loadedSrc;
          frame.dataset.effect = nextItem.effect;
          placeFrame(nextItem.width, nextItem.height);
          mobileNextImage = null;
          prepareMobileNext().catch(() => {
            mobileNextImage = null;
          });
          await wait(85);
          if (paused || version !== transitionVersion) return;
          frame.classList.remove("is-hidden");
          scheduleMobileNext();
          return;
        }

        let nextItem;
        try {
          nextItem = await preload(takeItem(false), false);
        } catch (_error) {
          timer = window.setTimeout(showNext, 100);
          return;
        }
        frame.classList.add("is-hidden");
        await wait(180);
        frame.src = nextItem.loadedSrc;
        frame.dataset.effect = nextItem.effect;
        placeFrame(nextItem.width, nextItem.height);
        await wait(70);
        frame.classList.remove("is-hidden");
        if (!reducedMotion.matches) timer = window.setTimeout(showNext, 720);
      }

      function startAnimation() {
        window.clearTimeout(timer);
        if (!mobileViewport.matches) return;
        paused = document.hidden || reducedMotion.matches;
        frame.classList.remove("is-hidden");
        if (paused) return;
        if (mobileViewport.matches) {
          prepareMobileNext().catch(() => {
            mobileNextImage = null;
          });
          scheduleMobileNext();
        } else {
          timer = window.setTimeout(showNext, 720);
        }
      }

      document.addEventListener("visibilitychange", () => {
        window.clearTimeout(timer);
        transitionVersion += 1;
        paused = document.hidden || reducedMotion.matches;
        if (!document.hidden) startAnimation();
      });

      reducedMotion.addEventListener("change", () => {
        transitionVersion += 1;
        startAnimation();
      });
      mobileViewport.addEventListener("change", () => {
        transitionVersion += 1;
        mobileNextImage = null;
        placeFrame();
        startAnimation();
      });
      if (frame.complete && frame.naturalWidth) {
        placeFrame();
      } else {
        frame.addEventListener("load", () => placeFrame(), { once: true });
      }
      window.addEventListener("resize", () => placeFrame());
      startAnimation();

      fetch(targetUrl, { cache: "force-cache" }).catch(() => null);

      function enterProduct() {
        if (entering) return;
        entering = true;
        paused = true;
        transitionVersion += 1;
        window.clearTimeout(timer);
        document.body.classList.add("is-entering");
        window.setTimeout(() => window.location.assign(targetUrl), 140);
      }

      enterButton.addEventListener("click", enterProduct);

      // Desktop uses a quiet, draggable gallery; mobile keeps its original entry.
      const artField = document.getElementById("artField");
      const galleryLayout = [
        [
          "01-xerox.webp",
          0.08,
          0.12,
          138,
          170
        ],
        [
          "57-dotShirt.webp",
          0.31,
          0.1191289592760181,
          150,
          187
        ],
        [
          "60-penTrace.webp",
          0.4984305210918114,
          0.19988687782805428,
          142,
          177
        ],
        [
          "62-xerox.webp",
          0.8300000000000001,
          0.13,
          148,
          187
        ],
        [
          "66-xerox.webp",
          0.07999999999999999,
          0.43,
          110,
          187
        ],
        [
          "67-thermalMap.webp",
          0.88,
          0.44,
          138,
          183
        ],
        [
          "68-penTrace.webp",
          0.12,
          0.7699999999999999,
          102,
          187
        ],
        [
          "graphic-texture-chain-dotShirt (6).png",
          0.36,
          0.82,
          147,
          174
        ],
        [
          "graphic-texture-chain-thermalMap (10).png",
          0.6399999999999999,
          0.8099999999999999,
          162,
          167
        ],
        [
          "graphic-texture-chain-xerox (10).png",
          0.86,
          0.78,
          133,
          147
        ],
        [
          "graphic-texture-chain-xerox (7).png",
          0.6792803970223326,
          0.11312217194570136,
          130,
          150
        ]
      ];
      const galleryItems = [];
      let galleryInitialized = false;
      let drag = null;
      let topLayer = 1;
      const bound = (value, min, max) => Math.max(min, Math.min(max, value));
      function positionArt(item, x, y) {
        const margin = 12;
        item.x = bound(x, margin, window.innerWidth - item.width - margin);
        item.y = bound(y, margin, window.innerHeight - item.height - margin);
        item.button.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
      }
      function layoutGallery() {
        if (mobileViewport.matches) return;
        if (!galleryInitialized) {
          galleryInitialized = true;
          galleryLayout.forEach(([name, x, y, slotWidth, slotHeight], index) => {
            const button = document.createElement("button");
            button.className = "entry-art";
            button.type = "button";
            button.setAttribute("aria-label", `移动作品 ${index + 1} · 使用方向键移动`);
            button.setAttribute("aria-describedby", "dragHint");
            const img = document.createElement("img");
            img.alt = "";
            img.draggable = false;
            img.decoding = "async";
            img.src = `assets/idle-animation/loading-images-review/${name}`;
            button.append(img);
            const item = { button, img, nx: x, ny: y, slotWidth, slotHeight, moved: false, width: 0, height: 0, x: 0, y: 0 };
            galleryItems.push(item);
            artField.append(button);
            img.addEventListener("load", layoutGallery);
            button.addEventListener("pointerdown", (event) => {
              if (event.button !== 0 || drag) return;
              drag = { item, id: event.pointerId, dx: event.clientX - item.x, dy: event.clientY - item.y };
              item.button.style.zIndex = String(++topLayer);
              item.button.classList.add("is-dragging");
              button.setPointerCapture(event.pointerId);
              event.preventDefault();
            });
            button.addEventListener("pointermove", (event) => {
              if (!drag || drag.item !== item || event.pointerId !== drag.id) return;
              positionArt(item, event.clientX - drag.dx, event.clientY - drag.dy);
              item.moved = true;
              item.nx = (item.x + item.width / 2) / window.innerWidth;
              item.ny = (item.y + item.height / 2) / window.innerHeight;
            });
            const endDrag = () => {
              if (drag?.item !== item) return;
              item.button.classList.remove("is-dragging");
              drag = null;
            };
            button.addEventListener("pointerup", endDrag);
            button.addEventListener("pointercancel", endDrag);
            button.addEventListener("lostpointercapture", endDrag);
            button.addEventListener("keydown", (event) => {
              const delta = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[event.key];
              if (!delta) return;
              event.preventDefault();
              const step = event.shiftKey ? 20 : 5;
              positionArt(item, item.x + delta[0] * step, item.y + delta[1] * step);
              item.nx = (item.x + item.width / 2) / window.innerWidth;
              item.ny = (item.y + item.height / 2) / window.innerHeight;
            });
          });
        }
        const scale = Math.min(window.innerWidth / 1612, window.innerHeight / 884);
        document.documentElement.style.setProperty("--entry-scale", scale);
        galleryItems.forEach(item => {
          item.width = item.slotWidth * scale;
          item.height = item.slotHeight * scale;
          item.button.style.width = `${item.width}px`;
          item.button.style.height = `${item.height}px`;
          positionArt(item, item.nx * window.innerWidth - item.width / 2, item.ny * window.innerHeight - item.height / 2);
        });
      }
      layoutGallery();
      window.addEventListener("resize", layoutGallery);
      mobileViewport.addEventListener("change", layoutGallery);
    </script>
  </body>
</html>
